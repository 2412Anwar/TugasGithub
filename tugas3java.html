<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Tugas Pertemuan 3 Javascript</title>
</head>

<body>

    <h2>Sistem Manajemen Produk Toko</h2>

    <script>

        // Array untuk menyimpan data produk
        let produkToko = [
            {id: 1, nama: "Laptop", harga: 7000000, stok: 5},
            {id: 2, nama: "Mouse", harga: 200000, stok: 10},
            {id: 3, nama: "Keyboard", harga: 350000, stok: 7}
        ];

        // Fungsi untuk menambahkan produk baru
        function tambahProduk(nama, harga, stok) {
            let idBaru = produkToko.length + 1;

            produkToko.push({
                id: idBaru,
                nama: nama,
                harga: harga,
                stok: stok
            });
        }

        // Fungsi untuk menghapus produk berdasarkan id
        function hapusProduk(id) {
            let index = produkToko.findIndex(function(produk) {
                return produk.id === id;
            });

            if (index !== -1) {
                produkToko.splice(index, 1);
            }
        }

        // Fungsi untuk menampilkan daftar produk
        function tampilkanProduk() {
            console.log("Daftar Produk Toko:");

            produkToko.forEach(function(produk) {
                console.log(
                    "ID: " + produk.id +
                    " | Nama: " + produk.nama +
                    " | Harga: Rp" + produk.harga +
                    " | Stok: " + produk.stok
                );
            });
        }

        // Menampilkan produk awal
        tampilkanProduk();

        // Menambahkan produk baru
        tambahProduk("Headset", 300000, 8);

        // Menampilkan produk setelah ditambahkan
        tampilkanProduk();

        // Menghapus produk dengan id 2
        hapusProduk(2);

        // Menampilkan produk setelah dihapus
        tampilkanProduk();

    </script>

</body>
</html>
