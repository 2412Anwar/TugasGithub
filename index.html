<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas 1 JavaScript - Luas Bangun Datar</title>
</head>
<body>

    <h1>Menghitung Luas Bangun Datar</h1>

    <script>
        // Fungsi untuk menghitung luas persegi panjang
        function luasPersegiPanjang(panjang, lebar) {
            return panjang * lebar;
        }

        // Fungsi untuk menghitung luas bujur sangkar
        function luasBujurSangkar(sisi) {
            return sisi * sisi;
        }

        // Fungsi untuk menghitung luas segitiga
        function luasSegitiga(alas, tinggi) {
            return 0.5 * alas * tinggi;
        }


        // Nilai panjang dan lebar persegi panjang
        let panjang = 10;
        let lebar = 5;

        // Nilai sisi bujur sangkar
        let sisi = 6;

        // Nilai alas dan tinggi segitiga
        let alas = 8;
        let tinggi = 6;


        // Menghitung luas masing-masing bangun
        let hasilPersegiPanjang = luasPersegiPanjang(panjang, lebar);
        let hasilBujurSangkar = luasBujurSangkar(sisi);
        let hasilSegitiga = luasSegitiga(alas, tinggi);


        // Menampilkan hasil ke halaman HTML
        document.write("<h2>Hasil Perhitungan</h2>");

        document.write("<p><b>Persegi Panjang</b></p>");
        document.write("<p>Panjang = " + panjang + "</p>");
        document.write("<p>Lebar = " + lebar + "</p>");
        document.write("<p>Luas = " + hasilPersegiPanjang + "</p>");

        document.write("<hr>");

        document.write("<p><b>Bujur Sangkar</b></p>");
        document.write("<p>Sisi = " + sisi + "</p>");
        document.write("<p>Luas = " + hasilBujurSangkar + "</p>");

        document.write("<hr>");

        document.write("<p><b>Segitiga</b></p>");
        document.write("<p>Alas = " + alas + "</p>");
        document.write("<p>Tinggi = " + tinggi + "</p>");
        document.write("<p>Luas = " + hasilSegitiga + "</p>");
    </script>

</body>
</html>
